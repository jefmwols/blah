<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>12-Day Weather Forecast</title>
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>

<div id="bg"></div>

<!-- Day detail bottom sheet -->
<div class="detail-backdrop" id="detailBackdrop" onclick="closeDetail()"></div>
<div class="detail-sheet" id="detailSheet">
  <div class="sheet-handle"></div>
  <div id="detailContent"></div>
</div>

<div class="page">
  <div class="search-row">
    <input type="text" id="zipInput" placeholder="ZIP code or city" maxlength="60" />
    <button onclick="loadWeather()">Go</button>
  </div>

  <div id="app">
    <p class="status-msg">Loading forecast…</p>
  </div>
</div>

<script src="app.js?v=3"></script>
</body>
</html>
